<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Form</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
 <section class="container my-5">
  <h2 class="text-center mb-4">Contact Us</h2>
  <p class="text-center text-muted mb-4">We’d love to hear from you. Please fill out the form below and we’ll be in touch soon!</p>

  <form class="needs-validation" action="message.html" method="POST" novalidate>
    <div class="form1">
      <div class="col-md-6">
        <label for="name" class="form-label">Full Name *</label>
        <input type="text" class="form-control" id="name" name="name" required>
        <div class="invalid-feedback">Please enter your full name.</div>
      </div>

      <div>
        <label for="email" class="form-label">Email Address *</label>
        <input type="email" class="form-control" id="email" name="email" required>
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <div>
        <label for="phone" class="form-label">Phone Number *</label>
        <input type="tel" class="form-control" id="phone" name="phone" pattern="[0-9]{10}" required>
        <div class="invalid-feedback">Please enter a 10-digit phone number.</div>
      </div>

      <div>
        <label for="eventType" class="form-label">Type of Event *</label>
        <select class="form-select" id="eventType" name="eventType" required>
          <option value="" disabled selected>Choose...</option>
          <option>Wedding</option>
          <option>Birthday / Private Party</option>
          <option>Corporate Event</option>
          <option>Engagement</option>
          <option>Other</option>
        </select>
        <div class="invalid-feedback">Please select the type of event.</div>
      </div>

      <div class="col-12">
        <label for="message" class="form-label">Message *</label>
        <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
        <div class="invalid-feedback">Please enter your message.</div>
      </div>

      <div class="col-12 text-center">
        <button type="submit" class="btn btn-primary mt-3 px-5">Send Message</button>
      </div>
    </div>
  </form>
</section>

<!-- Bootstrap 5 Validation Script -->
<script>
  (() => {
    'use strict';

    const forms = document.querySelectorAll('.needs-validation');

    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault();  // Prevent submission
          event.stopPropagation();
        }

        form.classList.add('was-validated'); // Show validation errors
      }, false);
    });
  })();
</script>

  
      
      
</body>
</html>
